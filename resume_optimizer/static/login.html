<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>AI智简历</title>
<script>
  // 登录/注册已并入首页弹窗：本存根仅负责把旧地址/直接访问转回首页。
  var mode = /[?&]mode=register/.test(location.search) ? "register" : "login";
  location.replace("/?auth=" + mode);
</script>
</head>
<body>
<p style="font-family:sans-serif;text-align:center;padding:40px">正在前往… <a href="/?auth=login">点击继续</a></p>
</body>
</html>
